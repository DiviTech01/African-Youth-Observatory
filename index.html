<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>African Youth Observatory (AYO) | Africa's Youth Data Intelligence Platform</title>
    <meta name="description" content="Africa's most trusted youth data infrastructure powering policy, research, innovation, and investment decisions. Explore verified datasets on population, education, health, employment, and entrepreneurship." />
    <meta name="author" content="PACSDA - African Youth Observatory" />
    <meta name="keywords" content="African youth, youth data, Africa statistics, youth employment, youth education, African development, youth index" />
    <link rel="canonical" href="https://africanyouthobservatory.org" />

    <!-- Favicons — Vite copies public/ to the deployed root, so these
         paths work in dev, on Cloudflare Pages, and inside the Electron
         build. Browsers pick the best size they can render. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:title" content="African Youth Observatory (AYO) | Africa's Youth Data Intelligence Platform" />
    <meta property="og:description" content="Africa's most trusted youth data infrastructure powering policy, research, and investment decisions across the continent." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://africanyouthobservatory.org" />
    <meta property="og:site_name" content="African Youth Observatory" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@AYDatabase" />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:title" content="African Youth Observatory (AYO)" />
    <meta name="twitter:description" content="Africa's most trusted youth data infrastructure powering policy, research, and investment decisions." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>

  <body>
    <!-- First-paint shell: plain HTML/CSS (no script, so the CSP stays
         script-src 'self'). React's createRoot replaces everything inside
         #root on mount, so this disappears by itself. -->
    <style>
      .ayo-boot { position: fixed; inset: 0; background: #090d15; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #e8ecf3; }
      .ayo-boot-mark { font-size: 40px; font-weight: 800; letter-spacing: 0.08em; }
      .ayo-boot-mark span { color: #28bd5f; }
      .ayo-boot-spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.12); border-top-color: #28bd5f; animation: ayo-boot-spin 0.9s linear infinite; }
      @keyframes ayo-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .ayo-boot-spin { animation-duration: 2.5s; } }
    </style>
    <div id="root">
      <div class="ayo-boot" role="status" aria-label="Loading African Youth Observatory">
        <div class="ayo-boot-mark">AY<span>O</span></div>
        <div class="ayo-boot-spin" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
